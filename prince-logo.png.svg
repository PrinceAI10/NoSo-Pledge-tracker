<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4D976"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- name sits midway between the outer ring (r188) and inner circle (r140) -->
    <path id="nameArc" d="M 41.6,157.6 A 164,164 0 0,1 358.4,157.6"/>
  </defs>

  <!-- base, double circle border -->
  <circle cx="200" cy="200" r="190" fill="#0A1F44"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#D4AF37" stroke-width="1.6" opacity="0.85"/>

  <!-- name, larger, floating freely in the gap, touching neither circle -->
  <text font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#D4AF37" letter-spacing="2.8">
    <textPath href="#nameArc" startOffset="50%" text-anchor="middle">PRINCE OWUSU AFRIYIE</textPath>
  </text>

  <!-- interlocked P · O · A monogram, scaled up ~1.5x, centered inside the inner circle -->
  <g transform="translate(200 200) scale(1.5) translate(-200 -200)">
    <g fill="none" stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round">
      <line x1="200" y1="128" x2="200" y2="262" stroke-width="7"/>

      <path d="M200 135
               C 234 135, 250 148, 250 165
               C 250 182, 234 193, 200 193"
            stroke-width="6.5"/>

      <ellipse cx="200" cy="198" rx="30" ry="32" stroke-width="6.5"/>

      <path d="M200 230 C 196 230, 193 232, 191 236 L 164 270" stroke-width="5.5"/>
      <path d="M200 230 C 204 230, 207 232, 209 236 L 236 270" stroke-width="5.5"/>
      <path d="M181 254 L219 254" stroke-width="4.5"/>
      <path d="M188 266 L212 266" stroke-width="4"/>
      <path d="M164 270 L150 270" stroke-width="5.5"/>
      <path d="M236 270 L250 270" stroke-width="5.5"/>
    </g>

    <circle cx="200" cy="193" r="4" fill="#D4AF37"/>
    <circle cx="200" cy="228" r="4" fill="#D4AF37"/>
    <circle cx="200" cy="230" r="4" fill="#D4AF37"/>
  </g>
</svg>
